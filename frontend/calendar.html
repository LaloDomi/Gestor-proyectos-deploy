<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendario — ProjectFlow</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar-slot"></aside>
    <div class="main">
      <header class="topbar" id="topbar-slot"></header>
      <div class="page" id="page-slot"></div>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="common.js"></script>
  <script>
    const user = requireAuth();
    let CAL_CURSOR = new Date();
    let CAL_SELECTED_DAY = CAL_CURSOR.getDate();
    let EVENTOS = [];

    function renderCalendarPage() {
      document.getElementById("page-slot").innerHTML = calendarInnerHTML(CAL_CURSOR, CAL_SELECTED_DAY, EVENTOS);
    }
    function calShift(delta) {
      CAL_CURSOR = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth() + delta, 1);
      CAL_SELECTED_DAY = null;
      renderCalendarPage();
    }
    function calSelectDay(d) { CAL_SELECTED_DAY = d; renderCalendarPage(); }

    if (user) {
      initShell("calendar", "Calendario", "Vencimientos de todas tus tareas");
      refreshSidebarBadge("calendar");
      const pageSlot = document.getElementById("page-slot");
      pageSlot.innerHTML = loadingHTML("Cargando calendario…");
      (async () => {
        try {
          EVENTOS = await api.calendario.getAll();
          renderCalendarPage();
        } catch (err) {
          pageSlot.innerHTML = errorHTML(err);
        }
      })();
    }
  </script>
</body>
</html>
